name: Build Android Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: r25c
      API_LEVEL:   21
      ABI:         arm64-v8a

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install Android NDK r25c ─────────────────────────────────
      - name: Install NDK r25c
        run: |
          set -e
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
          wget -q "${NDK_URL}" -O "${NDK_ZIP}"
          unzip -q "${NDK_ZIP}"
          echo "NDK_ROOT=$(pwd)/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      # ── Cross-compile Ryzix for Android ARM64 ───────────────────
      - name: Build libryzix.so (ARM64)
        run: |
          set -e

          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang++"

          SRCS="src/position.cpp \
                src/movegen.cpp  \
                src/evaluate.cpp \
                src/tt.cpp       \
                src/timeman.cpp  \
                src/movepick.cpp \
                src/search.cpp   \
                src/book.cpp     \
                src/uci.cpp      \
                src/main.cpp"

          # Build as a plain executable (RyzixEngine.kt runs it via ProcessBuilder)
          "$CXX" \
            -O3 -DNDEBUG -std=c++17 \
            -march=armv8-a -ffast-math -funroll-loops \
            -static-libstdc++ \
            -I src \
            $SRCS \
            -lm \
            -o ryzix

          # Strip debug info to minimise size
          "${TOOLCHAIN}/llvm-strip" ryzix

          # Place as libryzix.so in the jniLibs layout expected by the Android app
          mkdir -p jniLibs/arm64-v8a
          cp ryzix jniLibs/arm64-v8a/libryzix.so

          echo "Build successful. Binary size:"
          ls -lh ryzix jniLibs/arm64-v8a/libryzix.so

      # ── Upload artifacts ─────────────────────────────────────────
      - name: Upload libryzix.so
        uses: actions/upload-artifact@v4
        with:
          name: libryzix-arm64
          path: jniLibs/arm64-v8a/libryzix.so

      # ── Create GitHub Release on main push ───────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Ryzix Engine build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            **Opening personality**
            - ♙ White: London System (d4 → Nf3 → Bf4 → e3 → Bd3 → c3 → 0-0)
            - ♟ Black: Caro-Kann Defence vs 1.e4 · QGD setup vs 1.d4

            **Architecture**
            Multi-file C++ (Stockfish-inspired):
            `position`, `movegen`, `evaluate`, `tt`, `timeman`,
            `movepick`, `search`, `book`, `uci`

            **Evaluation**: Classical HCE (PeSTO PSTs · mobility · pawn structure · king safety). No NNUE.
          files: jniLibs/arm64-v8a/libryzix.so
          token: ${{ secrets.GITHUB_TOKEN }}
